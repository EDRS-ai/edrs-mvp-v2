<style>
  body { font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color:#1f2937; }
  h1,h2,h3,h4,.font-heading { font-family: 'Roboto Condensed','Roboto',sans-serif; }
  .fade-in { animation: fadeIn 0.15s ease-in; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .fill-bar { transition: width 0.4s ease; }
  /* PROMPT 7: mapa live — Leaflet pulse, toast stack, live dot */
  #edrs-map { height: calc(100vh - 240px); min-height: 420px; border-radius: 0.5rem; }
  .leaflet-container { background: #eef2f7; font: inherit; }
  .pulse-marker { width: 18px; height: 18px; border-radius: 9999px; background: rgba(220,38,38,.85); box-shadow: 0 0 0 0 rgba(220,38,38,.7); animation: edrsPulse 1.6s ease-out infinite; }
  .pulse-marker.t1 { animation-duration: .9s; background: rgba(185,28,28,.95); }
  @keyframes edrsPulse {
    0%   { transform: scale(.75); box-shadow: 0 0 0 0 rgba(220,38,38,.7); }
    70%  { transform: scale(1.35); box-shadow: 0 0 0 16px rgba(220,38,38,0); }
    100% { transform: scale(.75); box-shadow: 0 0 0 0 rgba(220,38,38,0); }
  }
  .toast-stack { position: fixed; right: 1rem; bottom: 1rem; z-index: 1000; display: flex; flex-direction: column; gap: .5rem; max-width: 22rem; }
  .toast { animation: toastIn .22s ease-out; }
  .toast.leaving { animation: toastOut .2s ease-in forwards; }
  @keyframes toastIn  { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
  @keyframes toastOut { to { opacity: 0; transform: translateX(18px); } }
  .live-dot { width: .5rem; height: .5rem; border-radius: 9999px; background: #16a34a; animation: edrsBlink 2s infinite; display: inline-block; }
  .live-dot.off { background: #9ca3af; animation: none; }
  @keyframes edrsBlink { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
</style>
